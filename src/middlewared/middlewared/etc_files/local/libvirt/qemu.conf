<%
    # the internal development record: the emulated guest lane runs under the monolithic
    # libvirtd the VM plugin starts on demand.  Guests run as root like bhyve's do,
    # there is no security driver to label for, and logging goes to files so the
    # daemon does not depend on virtlogd being up.
%>\
# Generated by FreeCORE middlewared (etc.generate libvirt); edits are overwritten.
user = "root"
group = "wheel"
dynamic_ownership = 0
remember_owner = 0
security_driver = "none"
stdio_handler = "file"
vnc_listen = "0.0.0.0"
vnc_tls = 0
