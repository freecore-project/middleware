<%!
import shlex


def shell_value(value):
    return shlex.quote(str(value))


def shell_bool(value):
    return 'YES' if value else 'NO'


def command_args(config):
    args = [
        config['source'],
        config['mountpoint'],
        f"--seek-length={config['seek_length']}",
    ]
    if config['allow_other']:
        args.extend(['-o', 'allow_other'])
    args.extend(shlex.split(config.get('extra_options') or ''))
    return ' '.join(shlex.quote(str(arg)) for arg in args)
%>\
<%
config = render_ctx['rar2fs.config']
%>\
rar2fs_source=${shell_value(config['source'])}
rar2fs_mountpoint=${shell_value(config['mountpoint'])}
rar2fs_create_mountpoint="${shell_bool(config['create_mountpoint'])}"
rar2fs_command_args=${shell_value(command_args(config))}
