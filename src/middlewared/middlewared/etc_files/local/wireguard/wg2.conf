<%
	try:
		middleware.call_sync('wireguard.client.config_valid')
	except Exception:
		raise FileShouldNotExist()

	config = middleware.call_sync('wireguard.client.config')
%>\
[Interface]
PrivateKey = ${config['private_key']}
Address = ${config['address']}/${config['netmask']}
% if config['mtu']:
MTU = ${config['mtu']}
% endif
## No DNS directive on purpose: wg-quick would rewrite /etc/resolv.conf, which
## middleware owns and regenerates from its own network configuration (dns.sync,
## network.py). The two would overwrite each other. Tunnel DNS belongs in the
## system's network configuration instead.

[Peer]
PublicKey = ${config['peer_public_key']}
Endpoint = ${config['endpoint']}
AllowedIPs = ${', '.join(config['allowed_ips'])}
% if config['preshared_key']:
PresharedKey = ${config['preshared_key']}
% endif
% if config['keepalive']:
PersistentKeepalive = ${config['keepalive']}
% endif
