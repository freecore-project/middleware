# Client-side samba config for the api2 QA suite's runner.
#
# Install to /usr/local/etc/smb4.conf on the machine that RUNS the suite (on
# FreeBSD; /etc/samba/smb4.conf on Debian). This is runner-side only -- it is
# never installed on an appliance and nothing in the suite reads it from here.
#
# Why it has to exist:
#   protocols.py drives every SMB test from the runner -- the libsmb python
#   bindings plus smbclient, smbcacls and smbcquotas. Without this file all of
#   them die with
#       "Can't load /usr/local/etc/smb4.conf - run testparm to debug it"
#   and the entire SMB block of the suite fails for a reason that has nothing
#   to do with the appliance under test. A freshly built runner reproduces that
#   every time; it cost a full 13.3 baseline run to find.
#
# Why these particular lines:
#   client min protocol = NT1
#       Without it the SMB1-parametrised cases fail on the runner's own client:
#           "lp_load_ex: Max protocol NT1 is less than min protocol SMB2_02"
#       The 13.3 baseline previously mis-attributed that to the appliance.
#   no "client use spnego"
#       samba 4.16 raises on it as deprecated --
#           "lpcfg_do_global_parameter: WARNING: The "client use spnego" option
#            is deprecated"
#       -- which failed all four of test_437_smb_vss and masked the real
#       underlying error behind a config one. Do not add it back.
#
# Check with `testparm -s` after installing; it must be clean.
[global]
    workgroup = WORKGROUP
    client min protocol = NT1
    client max protocol = SMB3
    client signing = auto
    log level = 0
